<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>预习清单：{{title}}</title>
  <style>{{style}}</style>
</head>
<body><main>
  <header><p class="eyebrow">ENGLISH PREVIEW · {{mode}} · {{exam_label}}</p><h1>预习清单：{{title}}</h1></header>
  <section><h2>文章速览</h2><p class="overview">{{overview}}</p></section>
  <section><h2>必学词</h2>{{study_words}}</section>
  <section><h2>重点短语</h2>{{study_phrases}}</section>
  <section><h2>{{sentence_title}}</h2>{{sentence_breakdowns}}</section>
  <section><h2>关键段</h2>{{key_paragraphs}}</section>
  <section><h2>文章结构</h2>{{outline}}</section>
  <section><h2>行动清单</h2>{{action_items}}</section>
  {{warnings}}
  <footer>English Preview · 离线预习清单 · 请对照原文核对阅读提示</footer>
</main></body>
</html>
